syntax = "proto3";

option java_package = "br.sapiens.bellus_app";
option java_multiple_files = true;

message ClientData {
    string id = 1;
    string name = 2;
    string email = 3;
    string phone = 4;
}

message ProfessionalData {
    string id = 1;
    string name = 2;
    string email = 3;
}

message UserData {
   ClientData client = 1;
   ProfessionalData professional = 2;
}
